name: build

# 从源码出包（SignPath 对开源项目签名的硬性要求：产物必须可验证地构建自源码）。
# 三个产物：单文件 CLI、单文件 GUI、onedir GUI（zip，运行时不解压到 %TEMP%）。
# 全部以 artifact 形式上传，不进 Release；发版时人工确认后再附加。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MCD
            entry: tools/mcd_entry.py
            mode: --onefile --console
          - name: MCD-GUI
            entry: tools/gui_entry.py
            mode: --onefile --windowed
          - name: MCD-GUI-win64
            entry: tools/gui_entry.py
            mode: --onedir --windowed
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build ${{ matrix.name }}
        run: >
          pyinstaller ${{ matrix.mode }} --noconfirm
          --name ${{ matrix.name }}
          --icon packaging/icon.ico
          --paths .
          --distpath dist
          --workpath build/${{ matrix.name }}
          ${{ matrix.entry }}

      - name: Smoke test (CLI only)
        if: matrix.name == 'MCD'
        run: .\dist\MCD.exe --version

      - name: Package and checksum
        shell: pwsh
        run: |
          $name = "${{ matrix.name }}"
          $archive = "${{ matrix.archive }}"
          if ($archive -eq "zip") {
            Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force
            $target = "dist/$name.zip"
          } else {
            $target = "dist/$name.exe"
          }
          if (-not (Test-Path $target)) { throw "missing $target" }
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $target).Length
          Write-Host "$target  $size bytes  sha256=$hash"
          "$hash *$(Split-Path $target -Leaf)" | Set-Content "$target.sha256" -Encoding ASCII
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $target out/
          Copy-Item "$target.sha256" out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 14
