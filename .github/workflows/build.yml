name: build

# 在 CI 里从源码出包（SignPath 对开源项目签名的硬性要求：产物必须可验证地构建自源码）。
# 产物以 artifact 形式上传，不进 Release；需要发版时再人工确认后附加到 Release。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MCD
            entry: tools/mcd_entry.py
            mode: --console
          - name: MCD-GUI
            entry: tools/gui_entry.py
            mode: --windowed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build ${{ matrix.name }}
        run: >
          pyinstaller ${{ matrix.mode }} --onefile --noconfirm
          --name ${{ matrix.name }}
          --paths .
          --distpath dist
          --workpath build/${{ matrix.name }}
          ${{ matrix.entry }}

      - name: Smoke test (CLI only)
        if: matrix.name == 'MCD'
        run: .\dist\MCD.exe --version

      - name: Checksum
        shell: pwsh
        run: |
          $exe = "dist/${{ matrix.name }}.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $exe).Length
          Write-Host "$exe  $size bytes  sha256=$hash"
          "$hash *${{ matrix.name }}.exe" | Set-Content "dist/${{ matrix.name }}.exe.sha256" -Encoding ASCII

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}.exe
            dist/${{ matrix.name }}.exe.sha256
          if-no-files-found: error
          retention-days: 14
